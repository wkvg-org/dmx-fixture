# dmx-fixture — DMX512 relay actuator for ESP32-S3 Waveshare POE ETH 8DI 8RO.
# Receives DMX slots from the RS485 bus and controls 8 relays via PCA9538.

CONFIG_HEAP_MEM_POOL_SIZE=65000
CONFIG_PINCTRL=y

# Peripherals
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_I2C_ESP32=y
CONFIG_GPIO_PCA953X=y

# Shell / console
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_UART_LINE_CTRL=y

# Logging
CONFIG_LOG=y

# dmx-z driver (RX only)
CONFIG_DMX_Z=y
CONFIG_DMX_TX=n
CONFIG_DMX_RX=y
CONFIG_DMX_UART_NUM=1
CONFIG_DMX_TXD_INVERT=n
CONFIG_DMX_FIXTURE_START_ADDR=19

# Zbus
CONFIG_ZBUS=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
